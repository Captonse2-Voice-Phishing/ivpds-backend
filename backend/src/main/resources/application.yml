spring:
  application:
    name: ivpds-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ivpds}
    username: ${DB_USERNAME:ivpds}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            # When STARTTLS is on, never fall back to sending credentials in plain text.
            required: ${MAIL_SMTP_STARTTLS:false}
          # A slow or unreachable mail server must not hang the request that triggers the mail.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  servlet:
    multipart:
      max-file-size: ${AUDIO_MAX_FILE_SIZE:50MB}
      max-request-size: ${AUDIO_MAX_REQUEST_SIZE:51MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # A mail outage must not mark the whole backend as unhealthy.
      enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.ivpds: ${IVPDS_LOG_LEVEL:INFO}

ivpds:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ivpds
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    password-reset:
      code-ttl: 15m
      max-attempts: 5
      resend-interval: 60s
  storage:
    # Any S3-compatible endpoint: MinIO in development, Amazon S3 later.
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET:ivpds-audio}
    # MinIO needs path-style URLs (http://host/bucket/key); Amazon S3 does not.
    path-style-access: ${STORAGE_PATH_STYLE:true}
    connect-timeout: ${STORAGE_CONNECT_TIMEOUT:3s}
    # Upper bound for one storage operation, retries included.
    request-timeout: ${STORAGE_REQUEST_TIMEOUT:60s}
  ai:
    # The FastAPI AI service (speech-to-text, rule engine, NLP model, risk engine).
    base-url: ${AI_BASE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    # Whisper on CPU can take minutes for a long call.
    transcription-timeout: ${AI_TRANSCRIPTION_TIMEOUT:10m}
    risk-timeout: ${AI_RISK_TIMEOUT:60s}
    # After a live call ends, how long to wait for the AI service's final result.
    live-finish-timeout: ${AI_LIVE_FINISH_TIMEOUT:60s}
  analysis:
    # Start an analysis automatically when a call is uploaded.
    auto-start: ${ANALYSIS_AUTO_START:true}
    # Analyses processed at the same time; the AI service runs on CPU, so keep this small.
    workers: ${ANALYSIS_WORKERS:2}
    # Analyses allowed to wait for a free worker; beyond this, new requests are refused with 503.
    queue-capacity: ${ANALYSIS_QUEUE_CAPACITY:50}
  reports:
    # Time zone used to split days in the admin statistics.
    time-zone: ${REPORT_TIME_ZONE:Asia/Ho_Chi_Minh}
  live:
    # How long the one-time ticket returned by POST /api/v1/live-calls stays valid.
    ticket-ttl: ${LIVE_TICKET_TTL:60s}
  mail:
    from: ${MAIL_FROM:no-reply@ivpds.local}
  bootstrap:
    admin:
      # Optional: when both are set, an ADMIN account is created at startup if it does not exist yet.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Administrator}
