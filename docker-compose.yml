name: ivpds

services:
  postgres:
    image: postgres:17-alpine
    container_name: ivpds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    build:
      context: ./infra/minio
    image: ivpds/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: ivpds-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Development mailbox: accepts all mail over SMTP and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: ivpds-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Internal AI service: called only by the backend, never by the mobile app or admin web.
  ai:
    build:
      context: ./ai
      target: runtime
    image: ivpds/ai:dev
    container_name: ivpds-ai
    restart: unless-stopped
    environment:
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required (at least 16 characters)}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      # Speech-to-text uses PhoWhisper-medium, which is built into the image (see ai/Dockerfile).
      AI_WHISPER_CPU_THREADS: ${AI_WHISPER_CPU_THREADS:-0}
      # Fine-tuned NLP model. The artifact is not in the image or in git (it is large): it is read from
      # ai/models/<name> on this machine. Without it the service still runs and reports the model as UNAVAILABLE.
      AI_NLP_MODEL_DIR: /opt/models/nlp/${AI_NLP_MODEL_NAME:-phobert-base-r6}
    volumes:
      - ./ai/models:/opt/models/nlp:ro
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Loading the speech-to-text model takes a few seconds before the service answers.
      start_period: 60s

  backend:
    build:
      context: ./backend
    image: ivpds/backend:dev
    container_name: ivpds-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      # Development uses the MinIO root account; use a dedicated access key outside development.
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ivpds-audio}
      STORAGE_REQUEST_TIMEOUT: ${STORAGE_REQUEST_TIMEOUT:-60s}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 characters)}
      # The AI service is called by name on the compose network. The backend starts and serves
      # everything else even when the AI service is down; analyses then fail with a clear code.
      AI_BASE_URL: http://ai:8000
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required (at least 16 characters)}
      AI_TRANSCRIPTION_TIMEOUT: ${AI_TRANSCRIPTION_TIMEOUT:-10m}
      ANALYSIS_AUTO_START: ${ANALYSIS_AUTO_START:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Defaults send to Mailpit; set MAIL_HOST etc. in .env to use a real SMTP server.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ivpds.local}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
